<!-- hangman-sprite.svg -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      .h-stroke { fill: none; stroke: #111; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4 }
      .h-fill { fill: #111 }
    </style>
  </defs>

  <symbol id="gallows-base" viewBox="0 0 120 20">
    <line x1="6" y1="4" x2="114" y2="4" class="h-stroke" />
    <rect x="10" y="6" width="14" height="8" class="h-stroke h-fill" />
    <rect x="96" y="6" width="14" height="8" class="h-stroke h-fill" />
  </symbol>

  <symbol id="gallows-post" viewBox="0 0 120 160">
    <rect x="30" y="10" width="8" height="140" rx="2" class="h-stroke h-fill"/>
  </symbol>

  <symbol id="gallows-beam" viewBox="0 0 120 160">
    <rect x="36" y="10" width="60" height="8" rx="2" class="h-stroke h-fill"/>
  </symbol>

  <symbol id="gallows-hanger" viewBox="0 0 120 160">
    <line x1="96" y1="18" x2="96" y2="39" class="h-stroke"/>
  </symbol>

  <symbol id="rope-loop" viewBox="0 0 120 160">
    <path d="M96 36 q6 4 0 12" class="h-stroke"/>
    <circle cx="96" cy="52" r="3" class="h-stroke"/>
  </symbol>

  <symbol id="head" viewBox="0 0 120 160">
    <circle cx="96" cy="56" r="14" class="h-stroke" />
  </symbol>

  <symbol id="torso" viewBox="0 0 120 160">
    <line x1="96" y1="70" x2="96" y2="104" class="h-stroke"/>
  </symbol>

  <symbol id="left-arm" viewBox="0 0 120 160">
    <line x1="96" y1="78" x2="78" y2="92" class="h-stroke"/>
  </symbol>

  <symbol id="right-arm" viewBox="0 0 120 160">
    <line x1="96" y1="78" x2="114" y2="92" class="h-stroke"/>
  </symbol>

  <symbol id="left-leg" viewBox="0 0 120 160">
    <line x1="96" y1="104" x2="82" y2="132" class="h-stroke"/>
  </symbol>

  <symbol id="right-leg" viewBox="0 0 120 160">
    <line x1="96" y1="104" x2="110" y2="132" class="h-stroke"/>
  </symbol>
</svg>
